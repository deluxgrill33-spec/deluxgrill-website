<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delux Grill | Laatzen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #e63946;
            --secondary: #d4af37;
            --dark: #0f0f0f;
            --darker: #050505;
            --card-bg: #1a1a1a;
            --text: #f8f9fa;
            --text-muted: #b0b0b0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--dark); color: var(--text); line-height: 1.6; padding-bottom: 120px; }
        
        .admin-bar { background: #000; color: var(--secondary); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; font-size: 0.9rem; font-weight: 600; }
        .admin-toggle-btn { background: var(--secondary); color: #000; border: none; padding: 6px 15px; border-radius: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .store-header { background: linear-gradient(135deg, #111, #1f1f1f); padding: 25px 20px; border-bottom: 2px solid var(--secondary); text-align: center; }
        .store-card { background: var(--card-bg); max-width: 600px; margin: auto; border-radius: 20px; padding: 20px; border: 1px solid #333; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .store-logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--secondary); margin-bottom: 15px; }
        .store-title { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .store-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; }
        
        .badge-status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }
        .status-open { background: rgba(40, 167, 69, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .status-closed { background: rgba(230, 57, 70, 0.2); color: var(--primary); border: 1px solid var(--primary); }

        .info-pill { display: inline-flex; align-items: center; gap: 8px; background: #252525; padding: 8px 15px; border-radius: 25px; font-size: 0.85rem; color: #ddd; margin: 4px; border: 1px solid #333; text-decoration: none; }
        
        .action-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .action-btn { background: #252525; color: var(--secondary); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.1rem; border: 1px solid #444; }
        .action-btn:hover { background: var(--secondary); color: #000; }

        .container { max-width: 1100px; margin: auto; padding: 20px; }

        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 15px 0; margin-bottom: 20px; white-space: nowrap; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: var(--card-bg); color: var(--text); border: 1px solid #333; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .cat-chip.active, .cat-chip:hover { background: var(--secondary); color: #000; border-color: var(--secondary); }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .food-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #2a2a2a; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .food-img { width: 100%; height: 170px; object-fit: cover; background: #222; }
        .food-info { padding: 15px; }
        .food-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .food-name { font-size: 1.15rem; font-weight: 600; color: #fff; }
        .food-price { color: var(--secondary); font-weight: 700; font-size: 1.1rem; }
        .food-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; }
        
        .add-cart-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .add-cart-btn:hover { background: #d32f2f; }

        /* لوحة التحكم (باللغة العربية حصرياً) */
        .admin-dashboard { display: none; background: #151515; padding: 25px; border-radius: 20px; border: 2px solid var(--secondary); margin-top: 20px; direction: rtl; text-align: right; }
        .admin-dashboard h2 { color: var(--secondary); margin-bottom: 20px; font-size: 1.6rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.95rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0a0a0a; color: #fff; border: 1px solid #444; border-radius: 10px; font-size: 1rem; }
        .save-btn { background: var(--secondary); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1.05rem; margin-top: 10px; }

        .cart-bar-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--darker); border-top: 2px solid var(--secondary); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); }
        .cart-total-text { font-size: 1.2rem; font-weight: 700; color: var(--secondary); }
        .whatsapp-checkout-btn { background: #25d366; color: white; padding: 12px 25px; border-radius: 30px; border: none; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 1.05rem; }
    </style>
</head>
<body>

    <div class="admin-bar">
        <span>Delux Grill Admin Panel</span>
        <button class="admin-toggle-btn" onclick="toggleAdminPanel()"><i class="fas fa-cog"></i> لوحة التحكم</button>
    </div>

    <div class="store-header">
        <div class="store-card">
            <img src="" id="header-logo" class="store-logo" alt="Logo">
            <h1 class="store-title" id="store-name">Delux Grill</h1>
            <p class="store-subtitle" id="txt-welcome">Herzlich willkommen 💛</p>
            
            <div id="status-badge" class="badge-status status-open">🟢 Geöffnet</div>
            
            <div>
                <a href="https://maps.app.goo.gl/pD2zfXSGVD6yzgc1" target="_blank" class="info-pill"><i class="fas fa-map-marker-alt" style="color:var(--primary);"></i> Hildesheimer Str. 520, 30880 Laatzen</a>
                <span class="info-pill"><i class="fas fa-clock" style="color:var(--secondary);"></i> <span id="txt-time">Fertig in 30 Min.</span></span>
                <span class="info-pill"><i class="fas fa-check" style="color:#2ecc71;"></i> Halal</span>
            </div>

            <div class="action-buttons">
                <a href="https://wa.me/491029324412" target="_blank" class="action-btn"><i class="fab fa-whatsapp"></i></a>
                <a href="tel:051029324412" class="action-btn"><i class="fas fa-phone"></i></a>
                <a href="https://maps.app.goo.gl/pD2zfXSGVD6yzgc1" target="_blank" class="action-btn"><i class="fas fa-directions"></i></a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- واجهة الزبون (تتغير لغتها تلقائياً حسب جوال الزبون) -->
        <div id="customer-view">
            <div class="categories-scroll" id="categories-container"></div>
            <div id="menu-items-grid"></div>
        </div>

        <!-- لوحة التحكم (عربي حصرياً) -->
        <div id="admin-panel" class="admin-dashboard">
            <h2>🛠️ لوحة تحكم المطعم (إدارة المنيو والإعدادات)</h2>
            
            <div style="background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                <h3 style="color: var(--secondary); margin-bottom: 15px;">إعدادات المطعم العامة</h3>
                <div class="form-group">
                    <label>حالة المطعم:</label>
                    <select id="setting-status">
                        <option value="open">مفتوح (Geöffnet)</option>
                        <option value="closed">مغلق (Geschlossen)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اسم المطعم:</label>
                    <input type="text" id="setting-name" value="Delux Grill">
                </div>
                <div class="form-group">
                    <label>رابط الشعار:</label>
                    <input type="text" id="setting-logo" value="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=200&q=80">
                </div>
                <div class="form-group">
                    <label>رقم الواتساب:</label>
                    <input type="text" id="setting-whatsapp" value="491029324412">
                </div>
                <button class="save-btn" onclick="saveStoreSettings()">حفظ إعدادات المطعم</button>
            </div>

            <div style="background: #1f1f1f; padding: 20px; border-radius: 12px;">
                <h3 style="color: var(--secondary); margin-bottom: 15px;">➕ إضافة وجبة جديدة للمنيو</h3>
                <div class="form-group">
                    <label>اسم الوجبة:</label>
                    <input type="text" id="item-name" placeholder="مثال: Pizza Margherita">
                </div>
                <div class="form-group">
                    <label>القسم:</label>
                    <select id="item-cat">
                        <option value="Pizza">Pizza</option>
                        <option value="Calzone">Calzone</option>
                        <option value="Pide">Pide</option>
                        <option value="Hamburger">Hamburger</option>
                        <option value="Döner">Döner</option>
                        <option value="Getränke">Getränke</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر (€):</label>
                    <input type="number" step="0.5" id="item-price" placeholder="8.00">
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <input type="text" id="item-desc" placeholder="مكونات الوجبة...">
                </div>
                <div class="form-group">
                    <label>رابط الصورة:</label>
                    <input type="text" id="item-img" placeholder="https://...">
                </div>
                <button class="save-btn" style="background: var(--primary); color: #fff;" onclick="addNewFoodItem()">إضافة الوجبة فوراً</button>
            </div>
        </div>
    </div>

    <div class="cart-bar-bottom">
        <div class="cart-total-text"><span id="txt-total-label">Total</span>: <span id="cart-total-price">0.00</span> €</div>
        <button class="whatsapp-checkout-btn" onclick="checkoutWhatsApp()"><i class="fab fa-whatsapp"></i> <span id="txt-order-btn">Bestellung via WhatsApp</span></button>
    </div>

    <script>
        // قواميس اللغات التلقائية حسب لغة جوال الزبون (عربي، تركي، روسي، روماني، إنجليزي، ألماني)
        const userLang = navigator.language || navigator.userLanguage || "de";
        let langCode = "de"; // الافتراضي ألماني

        if (userLang.startsWith("ar")) langCode = "ar";
        else if (userLang.startsWith("tr")) langCode = "tr";
        else if (userLang.startsWith("ru")) langCode = "ru";
        else if (userLang.startsWith("ro")) langCode = "ro";
        else if (userLang.startsWith("en")) langCode = "en";

        const translations = {
            ar: { welcome: "أهلاً بك 💛", time: "جاهز خلال 30 دقيقة", open: "🟢 مفتوح حالياً", closed: "🔴 مغلق حالياً", total: "المجموع الكلي", orderBtn: "إرسال الطلب عبر الواتساب", all: "الكل", addBtn: "إضافة للسلة", msgHeader: "مرحباً، أود طلب الأكل التالي من Delux Grill:%0A" },
            tr: { welcome: "Hoş Geldiniz 💛", time: "30 dakikada hazır", open: "🟢 Açık", closed: "🔴 Kapalı", total: "Toplam", orderBtn: "WhatsApp ile Sipariş Ver", all: "Tümü", addBtn: "Sepete Ekle", msgHeader: "Merhaba, Delux Grill'den şu siparişi vermek istiyorum:%0A" },
            ru: { welcome: "Добро пожаловать 💛", time: "Готовность 30 мин.", open: "🟢 Открыто", closed: "🔴 Закрыто", total: "Итого", orderBtn: "Заказать через WhatsApp", all: "Все", addBtn: "В корзину", msgHeader: "Здравствуйте, я хочу заказать в Delux Grill:%0A" },
            ro: { welcome: "Bine ați venit 💛", time: "Gata în 30 min.", open: "🟢 Deschis", closed: "🔴 Închis", total: "Total", orderBtn: "Comandă prin WhatsApp", all: "Toate", addBtn: "Adaugă", msgHeader: "Salut, aș dori să comand de la Delux Grill:%0A" },
            en: { welcome: "Welcome 💛", time: "Ready in 30 mins", open: "🟢 Open", closed: "🔴 Closed", total: "Total", orderBtn: "Order via WhatsApp", all: "All", addBtn: "Add to Cart", msgHeader: "Hello, I would like to order from Delux Grill:%0A" },
            de: { welcome: "Herzlich willkommen 💛", time: "Fertig in 30 Min.", open: "🟢 Geöffnet", closed: "🔴 Geschlossen", total: "Gesamt", orderBtn: "Bestellung via WhatsApp", all: "Alle", addBtn: "Hinzufügen", msgHeader: "Hallo, ich möchte gerne folgende Bestellung bei Delux Grill aufgeben:%0A" }
        };

        const t = translations[langCode] || translations["de"];

        // تعديل اتجاه الصفحة تلقائياً إذا كان الزبون جهازه عربي
        if (langCode === "ar") {
            document.documentElement.setAttribute("dir", "rtl");
        } else {
            document.documentElement.setAttribute("dir", "ltr");
        }

        let defaultSettings = {
            name: "Delux Grill",
            status: "open",
            logo: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=200&q=80",
            whatsapp: "491029324412"
        };

        let defaultMenu = [
            { id: 1, name: "Pizza Margherita", category: "Pizza", price: 8.00, desc: "mit Tomatensoße & Käse", img: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Pizza Tonno", category: "Pizza", price: 10.00, desc: "Thunfisch, Zwiebeln", img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Donertasche", category: "Döner", price: 7.00, desc: "Mit Salat & Soße", img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Cheeseburger", category: "Hamburger", price: 8.00, desc: "100g Fleisch mit Käse", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" }
        ];

        let settings = JSON.parse(localStorage.getItem('delux_settings_v3')) || defaultSettings;
        let menuItems = JSON.parse(localStorage.getItem('delux_menu_v3')) || defaultMenu;
        let cart = [];
        let currentCat = "All";

        function initApp() {
            document.getElementById('store-name').innerText = settings.name;
            document.getElementById('header-logo').src = settings.logo;
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('txt-time').innerText = t.time;
            document.getElementById('txt-total-label').innerText = t.total;
            document.getElementById('txt-order-btn').innerText = t.orderBtn;

            document.getElementById('setting-name').value = settings.name;
            document.getElementById('setting-logo').value = settings.logo;
            document.getElementById('setting-whatsapp').value = settings.whatsapp;
            document.getElementById('setting-status').value = settings.status;

            let badge = document.getElementById('status-badge');
            if(settings.status === 'open') {
                badge.className = "badge-status status-open";
                badge.innerText = t.open;
            } else {
                badge.className = "badge-status status-closed";
                badge.innerText = t.closed;
            }

            renderCategories();
            renderMenu();
        }

        function toggleAdminPanel() {
            let custView = document.getElementById('customer-view');
            let adminView = document.getElementById('admin-panel');
            if(adminView.style.display === 'block') {
                adminView.style.display = 'none';
                custView.style.display = 'block';
            } else {
                adminView.style.display = 'block';
                custView.style.display = 'none';
            }
        }

        function saveStoreSettings() {
            settings.name = document.getElementById('setting-name').value;
            settings.logo = document.getElementById('setting-logo').value;
            settings.whatsapp = document.getElementById('setting-whatsapp').value;
            settings.status = document.getElementById('setting-status').value;
            localStorage.setItem('delux_settings_v3', JSON.stringify(settings));
            initApp();
            alert('تم حفظ الإعدادات بنجاح!');
        }

        function addNewFoodItem() {
            let name = document.getElementById('item-name').value;
            let category = document.getElementById('item-cat').value;
            let price = parseFloat(document.getElementById('item-price').value);
            let desc = document.getElementById('item-desc').value;
            let img = document.getElementById('item-img').value || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=500&q=80";

            if(!name || isNaN(price)) {
                alert('الرجاء إدخال اسم الوجبة والسعر.');
                return;
            }

            menuItems.push({ id: Date.now(), name, category, price, desc, img });
            localStorage.setItem('delux_menu_v3', JSON.stringify(menuItems));
            
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-img').value = '';

            renderMenu();
            alert('تمت إضافة الوجبة بنجاح!');
            toggleAdminPanel();
        }

        function renderCategories() {
            let cats = ["All", ...new Set(menuItems.map(i => i.category))];
            let html = '';
            cats.forEach(c => {
                let active = currentCat === c ? 'active' : '';
                let label = c === 'All' ? t.all : c;
                html += `<button class="cat-chip ${active}" onclick="filterCat('${c}')">${label}</button>`;
            });
            document.getElementById('categories-container').innerHTML = html;
        }

        function filterCat(c) {
            currentCat = c;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            let filtered = currentCat === 'All' ? menuItems : menuItems.filter(i => i.category === currentCat);
            let html = '';
            filtered.forEach(item => {
                html += `
                    <div class="food-card">
                        <img src="${item.img}" class="food-img" alt="${item.name}">
                        <div class="food-info">
                            <div class="food-header">
                                <span class="food-name">${item.name}</span>
                                <span class="food-price">${item.price.toFixed(2)} €</span>
                            </div>
                            <p class="food-desc">${item.desc}</p>
                            <button class="add-cart-btn" onclick="addToCart('${item.name}', ${item.price})"><i class="fas fa-plus"></i> ${t.addBtn}</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('menu-items-grid').innerHTML = `<div class="menu-grid">${html}</div>`;
        }

        function addToCart(name, price) {
            cart.push({name, price});
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total-price').innerText = total.toFixed(2);
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let msg = t.msgHeader;
            let total = 0;
            cart.forEach((i, idx) => {
                msg += `${idx + 1}. ${i.name} - ${i.price.toFixed(2)} €%0A`;
                total += i.price;
            });
            msg += `%0ATotal: ${total.toFixed(2)} €`;
            window.open(`https://wa.me/${settings.whatsapp}?text=${msg}`, '_blank');
        }

        initApp();
    </script>
</body>
</html>
