        let settings = JSON.parse(localStorage.getItem('delux_settings_v6')) || defaultSettings;
        let menuItems = JSON.parse(localStorage.getItem('delux_menu_v6')) || defaultMenu;
        let cart = [];
        let currentCat = "All";

        function initApp() {
            document.getElementById('store-name').innerText = settings.name;
            document.getElementById('header-logo').src = settings.logo;
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('txt-time').innerText = t.time;
            document.getElementById('txt-total-label').innerText = t.total;
            document.getElementById('txt-order-btn').innerText = t.orderBtn;

            document.getElementById('setting-name').value = settings.name;
            document.getElementById('setting-logo').value = settings.logo;
            document.getElementById('setting-whatsapp').value = settings.whatsapp;
            document.getElementById('setting-status').value = settings.status;

            let badge = document.getElementById('status-badge');
            if(settings.status === 'open') {
                badge.className = "badge-status status-open";
                badge.innerText = t.open;
            } else {
                badge.className = "badge-status status-closed";
                badge.innerText = t.closed;
            }

            renderCategories();
            renderMenu();
        }

        function toggleAdminPanel() {
            let custView = document.getElementById('customer-view');
            let adminView = document.getElementById('admin-panel');
            if(adminView.style.display === 'block') {
                adminView.style.display = 'none';
                custView.style.display = 'block';
            } else {
                adminView.style.display = 'block';
                custView.style.display = 'none';
            }
        }

        function saveStoreSettings() {
            settings.name = document.getElementById('setting-name').value;
            settings.logo = document.getElementById('setting-logo').value;
            settings.whatsapp = document.getElementById('setting-whatsapp').value;
            settings.status = document.getElementById('setting-status').value;
            localStorage.setItem('delux_settings_v6', JSON.stringify(settings));
            initApp();
            alert('تم حفظ الإعدادات بنجاح!');
        }

        function addNewFoodItem() {
            let name = document.getElementById('item-name').value;
            let category = document.getElementById('item-cat').value;
            let price = parseFloat(document.getElementById('item-price').value);
            let desc = document.getElementById('item-desc').value;
            let img = document.getElementById('item-img').value || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=500&q=80";

            if(!name || isNaN(price)) {
                alert('الرجاء إدخال اسم الوجبة والسعر.');
                return;
            }

            menuItems.push({ id: Date.now(), name, category, price, desc, img });
            localStorage.setItem('delux_menu_v6', JSON.stringify(menuItems));
            
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-img').value = '';

            renderMenu();
            alert('تمت إضافة الوجبة بنجاح!');
            toggleAdminPanel();
        }

        function renderCategories() {
            let cats = ["All", ...new Set(menuItems.map(i => i.category))];
            let html = '';
            cats.forEach(c => {
                let active = currentCat === c ? 'active' : '';
                let label = c === 'All' ? t.all : c;
                html += `<button class="cat-chip ${active}" onclick="filterCat('${c}')">${label}</button>`;
            });
            document.getElementById('categories-container').innerHTML = html;
        }

        function filterCat(c) {
            currentCat = c;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            let filtered = currentCat === 'All' ? menuItems : menuItems.filter(i => i.category === currentCat);
            let html = '';
            filtered.forEach(item => {
                html += `
                    <div class="food-card">
                        <img src="${item.img}" class="food-img" alt="${item.name}">
                        <div class="food-info">
                            <div class="food-header">
                                <span class="food-name">${item.name}</span>
                                <span class="food-price">${item.price.toFixed(2)} €</span>
                            </div>
                            <p class="food-desc">${item.desc}</p>
                            <button class="add-cart-btn" onclick="addToCart('${item.name}', ${item.price})"><i class="fas fa-plus"></i> ${t.addBtn}</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('menu-items-grid').innerHTML = `<div class="menu-grid">${html}</div>`;
        }

        function addToCart(name, price) {
            cart.push({name, price});
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total-price').innerText = total.toFixed(2);
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            let msg = t.msgHeader;
            let total = 0;
            cart.forEach((i, idx) => {
                msg += `${idx + 1}. ${i.name} - ${i.price.toFixed(2)} €%0A`;
                total += i.price;
            });
            msg += `%0ATotal: ${total.toFixed(2)} €`;
            window.open(`https://wa.me/${settings.whatsapp}?text=${msg}`, '_blank');
        }

        initApp();
    </script>
