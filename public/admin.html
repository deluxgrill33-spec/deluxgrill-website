<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Delux Grill – لوحة الإعدادات</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--ink:#1b1f3a;--mut:#6b7090;--line:#dfe2ee;--acc:#c62828;--ok:#16a34a;--bad:#dc2626;--chg:#fff7d6}
@media (prefers-color-scheme:dark){:root{--bg:#12141f;--card:#1c1f2e;--ink:#eef0fa;--mut:#9aa0c0;--line:#2c3046;--chg:#3b3412}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
.w{max-width:640px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 12px max(14px,env(safe-area-inset-right))}
h1{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=time],select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input.p{width:92px;text-align:center;font-weight:700}
.ch{background:var(--chg)!important;border-color:#e0b400!important}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.btn.s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.b{width:100%}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--bg);padding:8px 0}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.cat{font-weight:800;font-size:17px;padding:12px 4px 6px}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .n{flex:1;min-width:0;overflow-wrap:anywhere}
.it.off .n{opacity:.45;text-decoration:line-through}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}
.sw.on::after{inset-inline-start:21px}
.save{position:fixed;inset-inline:0;bottom:0;padding:10px max(14px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:9}
.save .btn{max-width:612px;margin:0 auto;display:block}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px}
.days input{display:none}
.days label.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;inset-inline:16px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px;border-radius:12px;text-align:center;z-index:20}
img.th{width:70px;height:50px;object-fit:cover;border-radius:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w" id="login" hidden>
  <h1>🔐 لوحة الإعدادات – Delux Grill</h1>
  <div class="card">
    <p class="mut">سجّل دخول بنفس حساب المطبخ.</p>
    <p><input type="email" id="em" placeholder="Email" autocomplete="username"></p>
    <p><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password"></p>
    <button class="btn b" id="go">دخول</button>
    <p id="err" class="mut" style="color:var(--bad)"></p>
  </div>
</div>

<div class="w" id="app" hidden>
  <div class="row"><h1 class="g">⚙️ لوحة الإعدادات</h1><button class="btn s" id="out" style="padding:8px 12px">خروج</button></div>
  <div class="tabs" id="tabs">
    <button data-t="prices" class="on">💶 الأسعار</button>
    <button data-t="offers">🎁 العروض</button>
    <button data-t="hours">🕐 الدوام</button>
  </div>
  <div id="v"></div>
</div>
<div class="save" id="sv" hidden><button class="btn" id="save">💾 حفظ ونشر على الموقع</button></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const DN=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=null,CFG={items:{},opts:{},offers:null,shop:{}},BASE=null,TAB='prices',DIRTY=false,OPEN={};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function dirty(){DIRTY=true;$('#save').textContent='💾 حفظ ونشر على الموقع ●'}

$('#go').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(e=>$('#err').textContent='خطأ: '+e.code);
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $('#login').hidden=!!u;$('#app').hidden=!u;$('#sv').hidden=!u;
  if(!u)return;
  try{
    M=await (await fetch('menu.json?'+Date.now())).json();
    const s=await getDoc(doc(db,'config','site'));
    if(s.exists()&&s.data().data)CFG=JSON.parse(s.data().data);
    CFG.items=CFG.items||{};CFG.opts=CFG.opts||{};CFG.shop=CFG.shop||{};
    if(!CFG.offers)CFG.offers=M.offers.map(o=>({...o}));
    render();
  }catch(e){toast('تعذّر التحميل: '+e.message)}
});

/* ---------- helpers ---------- */
const itemP=i=>CFG.items[i.id]&&typeof CFG.items[i.id].p==='number'?CFG.items[i.id].p:i.price;
const itemA=i=>CFG.items[i.id]&&typeof CFG.items[i.id].a==='boolean'?CFG.items[i.id].a:i.active;
const sh=k=>CFG.shop[k]!==undefined?CFG.shop[k]:M.shop[k];
const sw=(on,a)=>`<button class="sw${on?' on':''}" ${a} aria-pressed="${on}"></button>`;

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  $('#v').innerHTML=TAB==='prices'?vPrices():TAB==='offers'?vOffers():vHours();
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;render();scrollTo(0,0)};

/* ---------- prices ---------- */
function vPrices(){
  let h='<input type="text" id="q" placeholder="🔍 ابحث عن صنف…" dir="auto" style="margin-bottom:6px">';
  M.cats.forEach(c=>{
    h+=`<div class="cat">${esc(c.name)}</div><div class="card" data-cat>`;
    c.items.forEach(i=>{
      const p=itemP(i),a=itemA(i),chg=p!==i.price;
      h+=`<div class="it${a?'':' off'}" data-n="${esc(i.name.toLowerCase())}"><div class="n">${esc(i.name)}</div><input class="p${chg?' ch':''}" type="number" step="0.10" inputmode="decimal" value="${p}" data-pi="${i.id}"><span>€</span>${sw(a,`data-ai="${i.id}"`)}</div>`;
    });
    h+='</div>';
  });
  if(M.groups.length){
    h+='<div class="cat">📏 الأحجام والإضافات (سعر زيادة)</div><div class="card">';
    M.groups.forEach(g=>{
      h+=`<div style="padding:6px 0;border-top:1px solid var(--line)"><div class="b mut">${esc(g.name)} <small>(${esc(g.id)})</small></div>`;
      g.options.forEach((o,ix)=>{
        const arr=CFG.opts[g.id],p=arr&&typeof arr[ix]==='number'?arr[ix]:o.price;
        h+=`<div class="it"><div class="n">${esc(o.name)}</div><input class="p${p!==o.price?' ch':''}" type="number" step="0.10" inputmode="decimal" value="${p}" data-go="${g.id}|${ix}"><span>€</span></div>`;
      });
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<p class="mut">ملاحظة: «–» أو سعر الزيادة 0 معناها بدون زيادة. زر الأخضر = الصنف ظاهر للزبائن.</p>';
  return h;
}

/* ---------- offers ---------- */
function vOffers(){
  let h='<button class="btn b" data-act="addoffer" style="margin-bottom:10px">＋ عرض جديد</button>';
  CFG.offers.forEach((o,ix)=>{
    const allItems=M.cats.flatMap(c=>c.items);
    const hasImg=!!o.img||(o.hasimg&&!o.noimg);
    h+=`<div class="card" data-o="${ix}">
      <div class="row" style="margin-bottom:8px"><b class="g">${esc(o.title||'عرض')}</b>${sw(o.active!==false,`data-oa="${ix}"`)}</div>
      <p style="margin:6px 0"><input type="text" dir="auto" placeholder="العنوان (مثلاً 🍕 Pizza-Mittwoch)" value="${esc(o.title)}" data-of="title|${ix}"></p>
      <p style="margin:6px 0"><textarea rows="2" dir="auto" placeholder="الوصف (Deutsch)" data-of="text|${ix}">${esc(o.text)}</textarea></p>
      <div class="mut">الأيام (فاضي = كل يوم):</div>
      <div class="days">${DN.map((d,di)=>`<label class="${(o.days||[]).includes(di)?'on':''}"><input type="checkbox" data-od="${ix}|${di}" ${(o.days||[]).includes(di)?'checked':''}>${d}</label>`).join('')}</div>
      <p style="margin:8px 0 4px" class="mut">يفتح الصنف عند الضغط (اختياري):</p>
      <select data-of="item|${ix}"><option value="">— بدون —</option>${allItems.map(i=>`<option value="${i.id}"${o.item===i.id?' selected':''}>${esc(i.name)}</option>`).join('')}</select>
      <div class="row" style="margin-top:10px">${o.img?`<img class="th" src="${o.img}">`:(hasImg?'<span class="mut">🖼 صورة محفوظة</span>':'<span class="mut">بدون صورة</span>')}
        <label class="btn s" style="padding:8px 12px">📷 صورة<input type="file" accept="image/*" hidden data-oi="${ix}"></label>
        ${hasImg?`<button class="btn s" style="padding:8px 12px" data-act="noimg" data-i="${ix}">✕ شيل الصورة</button>`:''}
        <button class="btn s" style="padding:8px 12px;color:var(--bad);margin-inline-start:auto" data-act="deloffer" data-i="${ix}">🗑 حذف</button></div>
    </div>`;
  });
  return h;
}

/* ---------- hours ---------- */
function vHours(){
  const hrs=sh('hours'),nt=sh('notice')||{on:false,text:''},fd=sh('freeDrink')||{on:false,min:0};
  let h=`<div class="card"><div class="row"><div class="g"><b>المطعم مفتوح للطلبات</b><div class="mut">أطفئه لإغلاق الطلبات فوراً (مثلاً إذا خلصنا)</div></div>${sw(sh('open')!==false,'data-s="open"')}</div>
  <div class="row" style="margin-top:12px"><div class="g"><b>فتح وإغلاق تلقائي حسب الدوام</b><div class="mut">الطلب بيقفل برا ساعات الدوام</div></div>${sw(!!sh('auto'),'data-s="auto"')}</div></div>
  <div class="card"><b>ساعات الدوام</b>`;
  hrs.forEach((x,d)=>{h+=`<div class="it"><div class="n">${DN[d]}</div><input type="time" data-h="${d}|from" value="${x.from}" style="width:100px"><input type="time" data-h="${d}|to" value="${x.to}" style="width:100px">${sw(x.on,`data-hon="${d}"`)}</div>`});
  h+=`</div><div class="card"><b>ملاحظة تحت الدوام</b><p style="margin:6px 0"><input type="text" dir="auto" data-s="hoursNote" value="${esc(sh('hoursNote')||'')}"></p><div class="mut">مثال: Feiertage 13–22 Uhr · Montag Ruhetag (ما بتنترجم أوتوماتيك إذا غيّرتها)</div></div>
  <div class="card"><div class="row"><b class="g">إشعار أعلى الصفحة</b>${sw(!!nt.on,'data-notion')}</div><p style="margin:6px 0"><textarea rows="2" dir="auto" data-nt>${esc(nt.text||'')}</textarea></p></div>
  <div class="card"><div class="row"><div class="g"><b>مشروب مجاني</b><div class="mut">عند طلب بقيمة معينة</div></div>${sw(!!fd.on,'data-fdon')}</div><div class="row" style="margin-top:8px"><span>الحد الأدنى</span><input class="p" type="number" inputmode="decimal" data-fdmin value="${fd.min||0}"><span>€</span></div></div>`;
  return h;
}

/* ---------- events ---------- */
function setShop(k,v){CFG.shop[k]=v;dirty()}
document.addEventListener('click',e=>{
  const s=e.target.closest('.sw');
  if(s){
    const on=!s.classList.contains('on');
    if(s.dataset.ai){CFG.items[s.dataset.ai]=CFG.items[s.dataset.ai]||{};CFG.items[s.dataset.ai].a=on;dirty();s.classList.toggle('on',on);s.closest('.it').classList.toggle('off',!on);return}
    if(s.dataset.oa!==undefined){CFG.offers[+s.dataset.oa].active=on;dirty();s.classList.toggle('on',on);return}
    if(s.dataset.s){setShop(s.dataset.s,on);s.classList.toggle('on',on);return}
    if(s.dataset.hon!==undefined){const hr=JSON.parse(JSON.stringify(sh('hours')));hr[+s.dataset.hon].on=on;setShop('hours',hr);s.classList.toggle('on',on);return}
    if('notion' in s.dataset){const n={...(sh('notice')||{})};n.on=on;setShop('notice',n);s.classList.toggle('on',on);return}
    if('fdon' in s.dataset){const n={...(sh('freeDrink')||{})};n.on=on;setShop('freeDrink',n);s.classList.toggle('on',on);return}
  }
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==='addoffer'){CFG.offers.unshift({id:'o_'+Date.now().toString(36),title:'',text:'',active:true,days:[]});dirty();render()}
  if(a==='deloffer'){if(b.dataset.c){CFG.offers.splice(i,1);dirty();render()}else{b.dataset.c=1;b.textContent='تأكيد الحذف؟'}}
  if(a==='noimg'){CFG.offers[i].img='';CFG.offers[i].noimg=true;dirty();render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){const q=t.value.toLowerCase();document.querySelectorAll('.it[data-n]').forEach(r=>r.hidden=q&&!r.dataset.n.includes(q));return}
  if(t.dataset.pi){const i=M.cats.flatMap(c=>c.items).find(x=>x.id===t.dataset.pi),v=parseFloat(String(t.value).replace(',','.'));if(!isNaN(v)){CFG.items[i.id]=CFG.items[i.id]||{};if(v===i.price){delete CFG.items[i.id].p}else CFG.items[i.id].p=v;dirty();t.classList.toggle('ch',v!==i.price)}return}
  if(t.dataset.go){const [g,ix]=t.dataset.go.split('|'),G=M.groups.find(x=>x.id===g),v=parseFloat(String(t.value).replace(',','.'));if(!isNaN(v)){CFG.opts[g]=CFG.opts[g]||G.options.map(o=>o.price);CFG.opts[g][+ix]=v;dirty();t.classList.toggle('ch',v!==G.options[+ix].price)}return}
  if(t.dataset.of){const [k,ix]=t.dataset.of.split('|');CFG.offers[+ix][k]=t.value;dirty();return}
  if(t.dataset.h){const [d,k]=t.dataset.h.split('|'),hr=JSON.parse(JSON.stringify(sh('hours')));hr[+d][k]=t.value;setShop('hours',hr);return}
  if(t.dataset.s==='hoursNote'){setShop('hoursNote',t.value);return}
  if('nt' in t.dataset){const n={...(sh('notice')||{})};n.text=t.value;setShop('notice',n);return}
  if('fdmin' in t.dataset){const n={...(sh('freeDrink')||{})};n.min=parseFloat(String(t.value).replace(',','.'))||0;setShop('freeDrink',n);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.od){const [ix,d]=t.dataset.od.split('|').map(Number),o=CFG.offers[ix];o.days=o.days||[];if(t.checked){if(!o.days.includes(d))o.days.push(d)}else o.days=o.days.filter(x=>x!==d);o.days.sort();t.parentElement.classList.toggle('on',t.checked);dirty();return}
  if(t.dataset.oi!==undefined&&t.files[0]){
    const ix=+t.dataset.oi,img=new Image(),u=URL.createObjectURL(t.files[0]);
    img.onload=()=>{const W=640,r=Math.min(1,W/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);CFG.offers[ix].img=c.toDataURL('image/jpeg',.72);delete CFG.offers[ix].noimg;URL.revokeObjectURL(u);dirty();render()};
    img.src=u;
  }
});

/* ---------- save ---------- */
$('#save').onclick=async()=>{
  const out={v:1,items:{},opts:{},shop:{...CFG.shop}};
  for(const k in CFG.items){const o={};if(typeof CFG.items[k].p==='number')o.p=CFG.items[k].p;if(typeof CFG.items[k].a==='boolean')o.a=CFG.items[k].a;if(Object.keys(o).length)out.items[k]=o}
  for(const g in CFG.opts){const G=M.groups.find(x=>x.id===g);if(G&&CFG.opts[g].some((v,i)=>v!==G.options[i].price))out.opts[g]=CFG.opts[g]}
  out.offers=CFG.offers.filter(o=>o.title||o.text).map(o=>{const r={...o};delete r.hasimg;if(!r.img)delete r.img;if(!r.item)delete r.item;return r});
  const s=JSON.stringify(out);
  if(s.length>900000){toast('الحجم كبير (صور العروض) – قلّل الصور');return}
  const b=$('#save');b.disabled=true;b.textContent='⏳ عم أحفظ…';
  try{await setDoc(doc(db,'config','site'),{data:s,updatedAt:Date.now()});DIRTY=false;toast('تم الحفظ ✅ – الموقع بيتحدّث عند الزبائن')}
  catch(e){toast('تعذّر الحفظ: '+(e.code||e.message)+' (تأكد من قواعد Firestore)')}
  b.disabled=false;b.textContent='💾 حفظ ونشر على الموقع';
};
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
